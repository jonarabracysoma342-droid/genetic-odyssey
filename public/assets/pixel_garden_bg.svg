<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <!-- Terraria-style Sky Gradient (Vibrant sky blue to soft daylight peach) -->
    <linearGradient id="terrariaSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    
    <!-- Mountain Gradients -->
    <linearGradient id="farHillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="midHillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="nearHillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>

  <!-- Embedded CSS for GPU-accelerated smooth Terraria-style cloud movement -->
  <style>
    @keyframes drift {
      from { transform: translateX(-300px); }
      to { transform: translateX(1700px); }
    }
    .cloud-layer {
      animation: drift linear infinite;
    }
    #cloud1 { animation-duration: 180s; animation-delay: -50s; }
    #cloud2 { animation-duration: 130s; animation-delay: -90s; }
    #cloud3 { animation-duration: 220s; animation-delay: -170s; }
    #cloud4 { animation-duration: 95s; animation-delay: -15s; }
  </style>

  <!-- Sky Background -->
  <rect width="1600" height="480" fill="url(#terrariaSky)" />

  <!-- Layer 1: Far Mountains (Very soft, large scale) -->
  <path d="M 0 320 
           L 100 300 L 250 220 L 400 280 L 550 180 L 700 250 L 850 210 L 1000 290 L 1150 190 L 1300 240 L 1450 200 L 1600 300 
           L 1600 480 L 0 480 Z" fill="url(#farHillGrad)" />

  <!-- Layer 2: Mid Mountains (Teal-green, medium scale) -->
  <path d="M 0 350
           L 120 330 L 200 290 L 320 320 L 450 260 L 580 310 L 710 240 L 820 290 L 950 220 L 1080 300 L 1210 250 L 1350 310 L 1480 270 L 1600 340
           L 1600 480 L 0 480 Z" fill="url(#midHillGrad)" />

  <!-- Terraria-style Dynamic Clouds -->
  <!-- Cloud 1 -->
  <g class="cloud-layer" id="cloud1">
    <g transform="translate(0, 40)" fill="#ffffff" opacity="0.85">
      <path d="M 20 20 h 60 v -5 h 40 v -5 h 80 v 5 h 40 v 5 h 40 v 10 h -260 z" />
      <path d="M 40 15 h 140 v -5 h -140 z" fill="#f1f5f9" />
    </g>
  </g>
  
  <!-- Cloud 2 -->
  <g class="cloud-layer" id="cloud2">
    <g transform="translate(0, 75)" fill="#ffffff" opacity="0.8">
      <path d="M 10 15 h 40 v -4 h 30 v -4 h 60 v 4 h 30 v 4 h 20 v 8 h -180 z" />
    </g>
  </g>
  
  <!-- Cloud 3 -->
  <g class="cloud-layer" id="cloud3">
    <g transform="translate(0, 55)" fill="#ffffff" opacity="0.9">
      <path d="M 20 20 h 60 v -5 h 50 v -5 h 70 v 5 h 30 v 5 h 30 v 10 h -240 z" />
    </g>
  </g>
  
  <!-- Cloud 4 -->
  <g class="cloud-layer" id="cloud4">
    <g transform="translate(0, 95)" fill="#ffffff" opacity="0.75">
      <path d="M 10 10 h 30 v -3 h 40 v -3 h 40 v 3 h 20 v 3 h 10 v 6 h -140 z" />
    </g>
  </g>

  <!-- Layer 3: Distant Forest Treeline (Arcade style repeated vertical block elements) -->
  <g fill="#065f46" opacity="0.9">
    <!-- Row of small blocky pine trees in the background -->
    <path d="M 0 380 
             L 20 370 L 25 375 L 30 370 L 40 380
             L 60 372 L 65 377 L 70 372 L 80 380
             L 100 368 L 105 374 L 110 368 L 125 380
             L 145 370 L 150 375 L 155 370 L 165 380
             L 190 373 L 195 378 L 200 373 L 215 380
             L 240 368 L 245 374 L 250 368 L 265 380
             L 290 371 L 295 376 L 300 371 L 315 380
             L 340 369 L 345 375 L 350 369 L 365 380
             L 390 373 L 395 378 L 400 373 L 415 380
             L 440 367 L 445 373 L 450 367 L 465 380
             L 490 372 L 495 377 L 500 372 L 515 380
             L 540 368 L 545 374 L 550 368 L 565 380
             L 590 371 L 595 376 L 600 371 L 615 380
             L 640 369 L 645 375 L 650 369 L 665 380
             L 690 373 L 695 378 L 700 373 L 715 380
             L 740 368 L 745 374 L 750 368 L 765 380
             L 790 371 L 795 376 L 800 371 L 815 380
             L 840 369 L 845 375 L 850 369 L 865 380
             L 890 373 L 895 378 L 900 373 L 915 380
             L 940 367 L 945 373 L 950 367 L 965 380
             L 990 372 L 995 377 L 1000 372 L 1015 380
             L 1040 368 L 1045 374 L 1050 368 L 1065 380
             L 1090 371 L 1095 376 L 1100 371 L 1115 380
             L 1140 369 L 1145 375 L 1150 369 L 1165 380
             L 1190 373 L 1195 378 L 1200 373 L 1215 380
             L 1240 368 L 1245 374 L 1250 368 L 1265 380
             L 1290 371 L 1295 376 L 1300 371 L 1315 380
             L 1340 369 L 1345 375 L 1350 369 L 1365 380
             L 1390 373 L 1395 378 L 1400 373 L 1415 380
             L 1440 367 L 1445 373 L 1450 367 L 1465 380
             L 1490 372 L 1495 377 L 1500 372 L 1515 380
             L 1540 368 L 1545 374 L 1550 368 L 1565 380
             L 1590 371 L 1595 376 L 1600 371 L 1600 480 L 0 480 Z" />
  </g>

  <!-- Layer 4: Terraria-style Green Grass Surface (Wavy pixelated edges) -->
  <path d="M 0 390 
           Q 80 380 160 390 T 320 390 T 480 390 T 640 390 T 800 390 T 960 390 T 1120 390 T 1280 390 T 1440 390 T 1600 390 
           L 1600 480 L 0 480 Z" fill="#22c55e" />

  <!-- Grass Blade Pixel Texture Details -->
  <g fill="#4ade80">
    <rect x="50" y="386" width="3" height="5" />
    <rect x="53" y="388" width="3" height="3" />
    
    <rect x="180" y="385" width="4" height="6" />
    <rect x="250" y="387" width="3" height="4" />
    
    <rect x="390" y="384" width="4" height="7" />
    <rect x="420" y="386" width="3" height="5" />
    
    <rect x="580" y="385" width="4" height="6" />
    <rect x="680" y="386" width="3" height="5" />
    
    <rect x="790" y="384" width="4" height="7" />
    <rect x="850" y="387" width="3" height="4" />
    
    <rect x="990" y="385" width="4" height="6" />
    <rect x="1050" y="386" width="3" height="5" />
    
    <rect x="1190" y="384" width="4" height="7" />
    <rect x="1280" y="387" width="3" height="4" />
    
    <rect x="1390" y="385" width="4" height="6" />
    <rect x="1490" y="386" width="3" height="5" />
  </g>

  <!-- Grass Shade / Undergrowth Layer -->
  <path d="M 0 402 
           Q 80 395 160 402 T 320 402 T 480 402 T 640 402 T 800 402 T 960 402 T 1120 402 T 1280 402 T 1440 402 T 1600 402 
           L 1600 480 L 0 480 Z" fill="#15803d" />

  <!-- Layer 5: Dirt / Soil Ground (Terraria Underground style) -->
  <rect x="0" y="415" width="1600" height="65" fill="#451a03" />
  
  <!-- Rock/Dirt Transition Shadows -->
  <rect x="0" y="410" width="1600" height="5" fill="#270e01" />

  <!-- Underground Terraria Treasures/Ores Details (Scattered Gold/Stone Pixel Blocks) -->
  <!-- Gold Ore blocks -->
  <g fill="#facc15">
    <rect x="120" y="430" width="6" height="6" />
    <rect x="126" y="433" width="3" height="3" />
    
    <rect x="480" y="445" width="5" height="5" />
    
    <rect x="750" y="425" width="8" height="4" />
    
    <rect x="1120" y="450" width="6" height="6" />
    <rect x="1126" y="453" width="4" height="3" />
    
    <rect x="1380" y="432" width="7" height="5" />
  </g>
  
  <!-- Stone Blocks -->
  <g fill="#78716c">
    <rect x="230" y="435" width="10" height="8" />
    <rect x="240" y="438" width="5" height="5" />
    
    <rect x="620" y="422" width="12" height="6" />
    
    <rect x="910" y="440" width="8" height="8" />
    
    <rect x="1250" y="428" width="10" height="8" />
    
    <rect x="1490" y="442" width="12" height="6" />
  </g>

  <!-- Deep Dirt Roots -->
  <g stroke="#270e01" stroke-width="2" fill="none">
    <path d="M 80 415 Q 85 435 75 450" />
    <path d="M 340 415 Q 335 430 345 448" />
    <path d="M 710 415 Q 715 440 705 455" />
    <path d="M 1030 415 Q 1025 435 1040 450" />
    <path d="M 1310 415 Q 1315 430 1305 448" />
  </g>
</svg>
