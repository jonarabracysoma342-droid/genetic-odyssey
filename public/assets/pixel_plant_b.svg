<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Terraria-style detailed Ercis Plant -->
  
  <!-- Stem Layer (Winding pixelated vines) -->
  <path d="M 24 48 Q 28 32 22 16" fill="none" stroke="#15803d" stroke-width="2" />
  <path d="M 24 48 Q 28 32 22 16" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="1,2" />

  <!-- Roots at base -->
  <rect x="22" y="46" width="4" height="2" fill="#14532d" />
  <rect x="20" y="47" width="8" height="1" fill="#166534" />

  <!-- Leaves (Pixel Clusters) -->
  <!-- Leaf 1 (Left Lower) -->
  <g transform="translate(12, 32)">
    <rect x="2" y="2" width="6" height="4" rx="1" fill="#166534" />
    <rect x="3" y="1" width="4" height="4" rx="1" fill="#22c55e" />
    <rect x="4" y="2" width="2" height="1" fill="#86efac" />
  </g>
  <!-- Leaf 2 (Right Mid) -->
  <g transform="translate(26, 24)">
    <rect x="1" y="2" width="6" height="4" rx="1" fill="#166534" />
    <rect x="2" y="1" width="4" height="4" rx="1" fill="#22c55e" />
    <rect x="3" y="2" width="2" height="1" fill="#86efac" />
  </g>
  <!-- Leaf 3 (Left Upper) -->
  <g transform="translate(14, 18)">
    <rect x="1" y="1" width="5" height="3" rx="1" fill="#166534" />
    <rect x="2" y="0" width="3" height="3" rx="1" fill="#22c55e" />
  </g>

  <!-- Hanging Pea Pod (Terraria style shape) -->
  <g transform="translate(24, 26)">
    <!-- Stem connector -->
    <path d="M 0 0 Q -2 4 -1 6" fill="none" stroke="#15803d" stroke-width="1" />
    <!-- Pod Body -->
    <rect x="-3" y="6" width="5" height="10" rx="2" fill="#ca8a04" />
    <rect x="-2" y="7" width="3" height="8" rx="1" fill="#eab308" />
    <!-- Pod Highlight -->
    <rect x="-2" y="8" width="1" height="6" fill="#fef08a" />
    <rect x="-1" y="14" width="1" height="1" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Top Flowers (Smooth layered pixel art look) -->
  <g transform="translate(18, 4)">
    <!-- Sepal (green base) -->
    <rect x="8" y="9" width="4" height="2" fill="#166534" />
    <rect x="9" y="8" width="2" height="1" fill="#22c55e" />

    <!-- Flower Petals Group -->
    <!-- Left petal -->
    <rect x="4" y="5" width="4" height="4" fill="#cbd5e1" />
    <rect x="5" y="6" width="3" height="2" fill="#ffffff" />
    <!-- Right petal -->
    <rect x="12" y="5" width="4" height="4" fill="#cbd5e1" />
    <rect x="12" y="6" width="3" height="2" fill="#ffffff" />
    <!-- Main Center petal -->
    <rect x="6" y="2" width="8" height="7" rx="1" fill="#cbd5e1" />
    <rect x="7" y="3" width="6" height="5" rx="1" fill="#ffffff" />
    <rect x="9" y="3" width="3" height="3" fill="#f8fafc" />
    
    <!-- Flower core / pistil -->
    <rect x="9" y="6" width="2" height="1" fill="#eab308" />
  </g>

  <!-- Round Seeds (3 smooth dots) -->
  <g transform="translate(28, 41)">
    <!-- Seed 1 -->
    <g transform="translate(0, 2)">
      <rect x="0" y="0" width="3" height="3" rx="1.2" fill="#ca8a04" />
      <rect x="1" y="1" width="1" height="1" fill="#fef08a" />
    </g>
    <!-- Seed 2 -->
    <g transform="translate(4, 3)">
      <rect x="0" y="0" width="3" height="3" rx="1.2" fill="#ca8a04" />
      <rect x="1" y="1" width="1" height="1" fill="#fef08a" />
    </g>
    <!-- Seed 3 -->
    <g transform="translate(2, 4)">
      <rect x="0" y="0" width="3" height="3" rx="1.2" fill="#ca8a04" />
      <rect x="1" y="1" width="1" height="1" fill="#fef08a" />
    </g>
  </g>
</svg>